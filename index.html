html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0 auto;max-width:36rem;padding:0 1.1rem 3rem;background:var(--bg);color:var(--ink);
  font:1.02rem/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,dt,.titolo-film{font-family:Literata,Georgia,"Times New Roman",serif}
h2{font-size:1.4rem;font-weight:600;margin:1.4rem 0 .6rem}

p{margin:.6rem 0}
.piccolo{font-size:.9rem;color:var(--muted)}
.testata{display:flex;gap:.7rem;align-items:center;padding:1.2rem 0 .2rem;color:var(--muted);font-size:.95rem}
.testata svg{flex:none;color:var(--accent)}
.testata b{font-family:Literata,Georgia,serif;font-weight:600;color:var(--ink);font-size:1.05rem}
ul.prototipi{margin:.4rem 0 1rem;padding-left:1.2rem}
ul.prototipi li{font-family:Literata,Georgia,serif}
.avanzamento{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.3rem;font-size:.9rem;color:var(--muted);margin-top:1rem}
.barra{flex-basis:100%;display:block;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.barra-piena{display:block;height:100%;background:var(--accent)}
.scheda{animation:entra .16s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.porta{margin:1.4rem auto 1.1rem;max-width:21rem;min-height:13rem;padding:3.4rem 1.4rem 1.5rem;text-align:center;
  background:var(--card);border:2px solid var(--accent);border-radius:10.5rem 10.5rem .7rem .7rem;
  box-shadow:inset 0 0 0 7px var(--glow);display:flex;flex-direction:column;justify-content:flex-end}
.titolo-film{font-size:1.6rem;font-weight:600;line-height:1.2;margin:0}
.porta .meta{margin:.45rem 0 0;color:var(--muted);font-size:.92rem}
.porta .verdetto{margin:.6rem 0 0;font-size:.92rem}
.lingue{display:grid;gap:.6rem;max-width:21rem;margin:1.5rem auto 0}
.domanda{max-width:21rem;margin:0 auto .6rem;font-weight:700;text-align:center}
.bottoni{display:grid;gap:.55rem;max-width:21rem;margin:0 auto}
button{font:inherit;cursor:pointer}
.scelta{padding:.85rem 1rem;border:1px solid var(--line);border-radius:.6rem;background:var(--card);color:var(--ink);font-size:1.02rem}
.scelta:hover{border-color:var(--accent)}
.scelta[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sotto{max-width:21rem;margin:1.1rem auto 0;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:.92rem}
details{font-size:.92rem;text-align:right}
details[open]{text-align:left}
summary{cursor:pointer;color:var(--accent)}
.primario{background:var(--accent);color:var(--on-accent);border:0;border-radius:.6rem;padding:.85rem 1.3rem;font-weight:700}
.secondario{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:.6rem;padding:.8rem 1.2rem}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.azioni{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.1rem}
.criteri{border-left:3px solid var(--accent);padding:.1rem 0 .1rem 1rem;margin:1rem 0}
.criteri dt{font-weight:600;margin-top:.8rem}
.criteri dd{margin:.2rem 0 0}
.criteri .es{display:block;margin-top:.2rem;font-size:.9rem;color:var(--muted)}
textarea{width:100%;min-height:6rem;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:.5rem;padding:.6rem;resize:vertical}
.errore{color:var(--err);font-weight:700}
@media (prefers-reduced-motion: reduce){.scheda{animation:none}}
</style>
</head>

function lento(){ return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
function scegli(btn, azione){
  if (S.blocco) return; S.blocco = true;
  btn.parentElement.querySelectorAll(".scelta").forEach(b => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
  setTimeout(azione, lento() ? 0 : 180);
}
function titolo(f){ return f[L]; }
function progresso(nome, n, t){
  return h("div", {class:"avanzamento"}, h("span", {}, nome), h("span", {}, X.film + " " + n + " " + X.di + " " + t),
    h("span", {class:"barra"}, h("span", {class:"barra-piena", style:"width:" + (100 * (n - 1) / t) + "%"})));
}
function porta(f, extra){
  return h("div", {class:"porta"}, h("h2", {class:"titolo-film"}, titolo(f)),
    h("p", {class:"meta"}, f.y + ", " + (f.a ? X.animazione : X.live)),
    extra ? h("p", {class:"verdetto"}, extra) : null);
}
function criteriEl(){
  return h("div", {class:"criteri"}, h("p", {}, X.criteriIntro),
    h("dl", {}, X.criteri.map(c => [h("dt", {}, c[0]), h("dd", {}, c[1], h("span", {class:"es"}, c[2]))])),
    h("p", {class:"piccolo"}, X.noncontano));
}

function lingua(){
  if (giaInviato()){
    return vai(h("section", {}, h("h2", {}, T.it.giaT + " / " + T.en.giaT), h("p", {}, T.it.giaP), h("p", {lang:"en"}, T.en.giaP)));
  }
  vai(h("section", {},
    h("h2", {}, "Scegli la lingua / Choose your language"),
    h("div", {class:"lingue"},
      h("button", {type:"button", class:"primario", lang:"it", onclick:() => imposta("it")}, "Italiano"),
      h("button", {type:"button", class:"primario", lang:"en", onclick:() => imposta("en")}, "English"))));
}
function imposta(l){
  L = l; X = T[l]; document.documentElement.lang = l;
  document.getElementById("tit").textContent = X.titolo; document.getElementById("sottotit").textContent = X.sottotitolo;
  intro();
}
function intro(){
  vai(h("section", {}, h("h2", {}, X.introT), h("p", {}, X.intro1), h("p", {}, X.intro2), h("p", {class:"piccolo"}, X.intro3),
    h("div", {class:"azioni"}, h("button", {class:"primario", type:"button", onclick:() => {
      S.inizio = Date.now(); S.ord1 = mescola(FILM.map((_, i) => i)); introFase1(); }}, X.inizia))));
}
function introFase1(){
  vai(h("section", {}, h("h2", {}, X.f1T), h("p", {}, X.f1descr), h("p", {}, X.f1es),
    h("ul", {class:"prototipi"}, X.prototipi.map(p => h("li", {}, p))), h("p", {}, X.f1istr),
    h("div", {class:"azioni"}, h("button", {class:"primario", type:"button", onclick:() => { S.i1 = 0; carta1(); }}, X.comincia))));
}
function carta1(){
  const t = S.ord1.length;
  if (S.i1 >= t) return fine1();
  const i = S.ord1[S.i1], f = FILM[i];
  vai(h("section", {}, progresso(X.parte1, S.i1 + 1, t), porta(f),
    h("div", {class:"bottoni"}, X.v1.map((v, k) => h("button", {type:"button", class:"scelta", "aria-pressed": S.r1[i] === COD1[k] ? "true" : "false",
      onclick:e => { S.r1[i] = COD1[k]; scegli(e.currentTarget, () => { S.i1++; carta1(); }); }}, v))),
    h("div", {class:"sotto"},
      S.i1 > 0 ? h("button", {type:"button", class:"link", onclick:() => { S.i1--; carta1(); }}, X.indietro) : h("span", {}),
      h("details", {}, h("summary", {}, X.rivediEs), h("p", {class:"piccolo"}, X.prototipi.join(", ") + ".")))));
}
function fine1(){
  vai(h("section", {}, h("h2", {}, X.fine1T), h("p", {}, X.fine1P),
    h("div", {class:"azioni"},
      h("button", {type:"button", class:"secondario", onclick:() => { S.i1 = S.ord1.length - 1; carta1(); }}, X.tornaUltimo),
      h("button", {type:"button", class:"primario", onclick:avviaFase2}, X.vaiF2))));
}
function avviaFase2(){
  S.fine1 = Date.now();
  S.ord2 = mescola(FILM.map((_, i) => i).filter(i => !FILM[i].c && S.r1[i] !== "non_visto"));
  S.i2 = 0;
  const ci = S.ord2.length > 0;
  vai(h("section", {}, h("h2", {}, X.f2T), h("p", {}, ci ? X.f2intro : X.f2nessuno),
    ci ? [h("p", {}, X.f2regole), criteriEl(), h("p", {}, X.f2motivo)] : null,
    h("div", {class:"azioni"}, h("button", {class:"primario", type:"button", onclick:() => ci ? carta2() : finale()}, ci ? X.iniziaF2 : X.vaiInvio))));
}
function carta2(passo){
  const t = S.ord2.length;
  if (S.i2 >= t) return finale();
  const i = S.ord2[S.i2], f = FILM[i], motivo = passo === "motivo";
  const area = motivo
    ? [h("p", {class:"domanda"}, X.domanda),
       h("div", {class:"bottoni"}, X.motivi.map((m, k) => h("button", {type:"button", class:"scelta", "aria-pressed": S.mot[i] === CODM[k] ? "true" : "false",
         onclick:e => { S.mot[i] = CODM[k]; scegli(e.currentTarget, () => { S.i2++; carta2(); }); }}, m)))]
    : h("div", {class:"bottoni"}, X.v2.map((v, k) => h("button", {type:"button", class:"scelta", "aria-pressed": S.r2[i] === COD2[k] ? "true" : "false",
         onclick:e => { S.r2[i] = COD2[k]; if (k === 0) delete S.mot[i];
           scegli(e.currentTarget, () => { if (k === 0){ S.i2++; carta2(); } else carta2("motivo"); }); }}, v)));
  const indietro = motivo
    ? h("button", {type:"button", class:"link", onclick:() => carta2()}, X.cambia)
    : (S.i2 > 0 ? h("button", {type:"button", class:"link", onclick:() => { S.i2--; carta2(); }}, X.indietro) : h("span", {}));
  vai(h("section", {}, progresso(X.parte2, S.i2 + 1, t),
    porta(f, motivo ? X.tuoVerdetto + X.v2[COD2.indexOf(S.r2[i])] : null), area,
    h("div", {class:"sotto"}, indietro, h("details", {}, h("summary", {}, X.rivediCr), criteriEl()))));
}
let btnInvia, errore;
function finale(){
  const nota = h("textarea", {id:"nota", maxlength:"2000"});
  nota.value = S.nota; nota.addEventListener("input", () => { S.nota = nota.value; });
  errore = h("p", {class:"errore", role:"alert"});
  btnInvia = h("button", {class:"primario", type:"button", onclick:invia}, X.invia);
  vai(h("section", {}, h("h2", {}, X.finaleT), h("p", {}, h("label", {for:"nota"}, X.nota)), nota,
    h("div", {class:"azioni"},
      S.ord2.length ? h("button", {type:"button", class:"secondario", onclick:() => { S.i2 = S.ord2.length - 1; carta2(); }}, X.tornaUltimo) : null,
      btnInvia), errore));
}
function invia(){
  if (S.invio) return;
  const risposte = FILM.map((f, i) => ({k:f.k, titolo:f.it, anno:f.y, controllo:!!f.c, fase1:S.r1[i] || "",
    fase2:S.r2[i] || "", motivo:S.mot[i] || "", pos1:S.ord1.indexOf(i) + 1, pos2:(S.ord2.indexOf(i) + 1) || ""}));
  const dati = {lingua:L, risposte:risposte, nota:S.nota, durata:Math.round((Date.now() - S.inizio) / 1000),
    durataFase1:Math.round((S.fine1 - S.inizio) / 1000)};
  if (!URL_SCRIPT) return grazie(true);
  S.invio = true; btnInvia.disabled = true; btnInvia.textContent = X.invio; errore.textContent = "";
  fetch(URL_SCRIPT, {method:"POST", body:JSON.stringify(dati), credentials:"omit"})
    .then(res => res.text().then(testo => {
      let ok = res.ok;
      try { ok = JSON.parse(testo).ok === true; } catch(e){}
      if (!ok) throw new Error("invio");
    }))
    .then(() => { try { localStorage.setItem(CHIAVE, "1"); } catch(e){} grazie(false); })
    .catch(() => { S.invio = false; btnInvia.disabled = false; btnInvia.textContent = X.invia; errore.textContent = X.errore; });
}
function grazie(anteprima){
  vai(h("section", {}, h("h2", {}, X.grazieT), h("p", {}, X.grazieP), anteprima ? h("p", {class:"piccolo"}, X.anteprima) : null));
}
lingua();
</script>
</body>
</html>
