<style>

button{font:inherit;cursor:pointer}
.scelta{padding:.85rem 1rem;border:1px solid var(--line);border-radius:.6rem;background:var(--card);color:var(--ink);font-size:1.02rem}

button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.azioni{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.1rem}

.criteri dt{font-weight:600;margin-top:.8rem}
.criteri dd{margin:.2rem 0 0}
.criteri .es{display:block;margin-top:.2rem;font-size:.9rem;color:var(--muted)}
textarea{width:100%;min-height:6rem;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:.5rem;padding:.6rem;resize:vertical}
.errore{color:var(--err);font-weight:700}
@media (prefers-reduced-motion: reduce){.scheda{animation:none}}
</style>
</head>

const VERDETTI = [["si","Sì"],["no","No"],["confine","Caso di confine"],["non_visto","Non l'ho visto"]];

const ESEMPI = [["C1, mondo inventato", "Eragon", "Mary Poppins"], ["C1, altrove in cui si entra", "Alice nel paese delle meraviglie (1951)", "Pirati dei Caraibi"], ["C1, mondo nascosto nel nostro", "Harry Potter", "Elliott il drago invisibile"], ["C2", "Laputa – Castello nel cielo", "Dune"], ["C3, comicità", "La spada nella roccia", "Le follie dell'imperatore"], ["C3, paura", "Dark Crystal", "Coraline"], ["C4, allegoria", "Principessa Mononoke", "Soul"], ["C4, mezzo per altro", "La città incantata", "La forma dell'acqua"]];

const app = document.getElementById("app");
const S = {inizio:0, nome:"", v:{}, mot:{}, nota:"", ord:[], i:0, blocco:false, invio:false};

function h(tag, props, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props || {})){
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");

function mescola(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function criteriEl(conEsempi){
  return h("div", {class:"criteri"},
    h("p", {}, "Un film è fantasy cinematografico positivo se soddisfa tutti e quattro questi criteri:"),
    h("dl", {}, CRITERI.map(c => [h("dt", {}, c[0]), h("dd", {}, c[1])])),

function intro(){
  if (giaInviato()) return vai(h("section", {}, h("h2", {}, "Hai già risposto"), h("p", {}, "Risulta che hai già inviato le risposte da questo dispositivo. Grazie!")));

    h("h2", {}, "Prima di cominciare"),
    h("p", {}, "Ti mostrerò 50 film, uno alla volta, da valutare applicando quattro criteri che descrivono un filone del cinema fantastico. Ci vogliono circa venti minuti."),
    h("p", {}, "Un film va valutato «Sì» solo se soddisfa tutti e quattro i criteri. Se ne manca anche uno, è «No»; se un criterio è soddisfatto solo in parte, è «Caso di confine». In questi due casi ti chiederò quale criterio più di tutti lo tiene fuori."),

}
function paginaCriteri(){

function carta(passo){
  const t = S.ord.length;

let btnInvia, errore;

function invia(){
  if (S.invio) return;

  fetch(URL_SCRIPT, {method:"POST", body:JSON.stringify(dati), credentials:"omit"})
    .then(res => res.text().then(testo => {
      let ok = false;

    .then(() => { try { localStorage.setItem(CHIAVE, "1"); } catch(e){} grazie(false); })
